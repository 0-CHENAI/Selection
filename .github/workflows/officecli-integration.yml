name: OfficeCLI Packaged Runtime Integration

on:
  pull_request:
    paths:
      - "apps/electron/resources/officecli/**"
      - "apps/electron/resources/bin/**/officecli*"
      - "packages/session-tools-core/src/**"
      - "packages/core/src/**"
      - "packages/shared/src/**"
      - "packages/server-core/src/**"
      - "packages/ui/src/**"
      - "packages/pi-agent-server/src/**"
      - "packages/session-mcp-server/src/**"
      - "scripts/build/common.ts"
      - "scripts/build-server.ts"
      - "scripts/sync-officecli.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/officecli-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
          - os: macos-13
            label: macos-x64
          - os: macos-15
            label: macos-arm64
          - os: windows-2025
            label: windows-x64
    runs-on: ${{ matrix.os }}
    name: officecli (${{ matrix.label }})
    timeout-minutes: 30
    env:
      OFFICECLI_INTEGRATION: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify reviewed runtime and resources
        run: bun run officecli:prepare && bun run officecli:check

      - name: Build packaged resource layout
        run: bun run electron:build:resources

      # Packaged runtime (prepare/check/resources + create/inspect/HTML) is the merge gate.
      # Strict finalize needs desktop Word/Excel/PowerPoint. Hosted windows-2025 does not
      # install Office, so that step is skipped unless OFFICECLI_REQUIRE_STRICT_FINALIZE=1.
      - name: Run real OfficeCLI integration suite
        run: bun run test:officecli:integration
        env:
          CRAFT_RESOURCES_BASE: ${{ github.workspace }}/apps/electron/dist
