# Path-filtered skill-install contract. These tests are not Darwin-specific.
name: Skill Install Contract

on:
  pull_request:
    paths:
      - 'packages/shared/src/skills/**'
      - 'packages/shared/src/agent/**'
      - 'packages/session-tools-core/**'
      - 'packages/session-mcp-server/**'
      - '.github/workflows/skill-install.yml'
      - '.github/actions/setup-selection-ci/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-install-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUSKY: "0"

jobs:
  skill-install:
    runs-on: ${{ matrix.os }}
    name: skill-install (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-selection-ci
      - run: bun test packages/shared/src/skills/install.test.ts packages/shared/src/skills/install-source.test.ts packages/shared/src/agent/__tests__/pi-skill-install.test.ts
