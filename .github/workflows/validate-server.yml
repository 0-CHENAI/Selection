# Manual only. macos-latest stays on this matrix because a person opted in;
# it is not part of the PR merge gate. See docs/ci.md.
name: Validate Server (Integration)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-server-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"

jobs:
  validate-server:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: validate-server (${{ matrix.os }})
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Selection CI
        uses: ./.github/actions/setup-selection-ci

      - name: Run --validate-server (includes automation conditions pass/fail)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.CRAFT_ANTHROPIC_API_KEY }}
          STITCH_API_KEY: ${{ secrets.STITCH_API_KEY }}
        run: bun run apps/cli/src/index.ts --validate-server --no-spinner --timeout 180000 --workspace-dir .github/agents
